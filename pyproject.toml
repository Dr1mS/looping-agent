[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "looping-agent"
version = "0.1.0"
description = "Read, edit and create Looping (.loo) MCD files; export MLD, MPD and SQL; MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
looping-agent = "looping_agent.__main__:main"
looping-mcp = "looping_agent.mcp_server:main"

[tool.setuptools]
packages = ["looping_agent"]

[tool.setuptools.package-data]
looping_agent = ["templates.json"]
